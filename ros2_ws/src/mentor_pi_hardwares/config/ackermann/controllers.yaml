/**/controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    vehicle:
      type: ackermann_steering_controller/AckermannSteeringController

/**/vehicle:
  ros__parameters:
    # Humble steering_controllers_library emits traction and steering arrays
    # in right, left order. Preserve that contract so inner/outer wheel speeds
    # and Ackermann steering angles are assigned to the correct joints.
    rear_wheels_names: ["wheel_right_rear_joint", "wheel_left_rear_joint"]
    front_wheels_names: ["wheel_right_front_joint", "wheel_left_front_joint"]
    base_frame_id: rear_axle_footprint
    odom_frame_id: odom
    enable_odom_tf: false
    use_stamped_vel: true
    reference_timeout: 0.1
    front_steering: true
    open_loop: false
    velocity_rolling_window_size: 10
    twist_covariance_diagonal: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]
    pose_covariance_diagonal: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]
    position_feedback: false
    front_wheel_track: 0.140
    rear_wheel_track: 0.140
    wheelbase: 0.135
    front_wheels_radius: 0.0325
    rear_wheels_radius: 0.0325
