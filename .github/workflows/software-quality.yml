name: Repository policy and native unit checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install focused test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
      - name: Validate component and documentation contracts
        run: |
          make check-compatibility
          ./tools/test_native_component_layout.sh
          ./tools/check_framework_docs.py
          ./micro_ros_agent/test/contract_test.sh
      - name: Run firmware domain tests against checked SDK
        run: |
          make -C firmware extract-sdk
          ./firmware/tools/test.sh 2
