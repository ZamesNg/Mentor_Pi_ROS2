vehicle:
  robot_name: mentor_pi
  vehicle_type: ackermann
hardware:
  feedback_timeout_ms: 500
  imu_timeout_ms: 500
  steering_pwm_channel: 3
  steering_pwm_min_us: 500
  steering_pwm_center_us: 1500
  steering_pwm_max_us: 2500
  steering_angle_min_rad: -0.6
  steering_angle_max_rad: 0.6
  steering_inverted: true
  steering_duration_ms: 20
  rear_wheel_radius_m: 0.0325
  wheelbase_m: 0.135
  linear_adrc_input_gain_per_second: 5.0
  linear_adrc_controller_bandwidth_rad_s: 1.0
  linear_adrc_observer_bandwidth_rad_s: 3.0
  yaw_adrc_input_gain_per_mps: 30.0
  yaw_adrc_controller_bandwidth_rad_s: 1.0
  yaw_adrc_observer_bandwidth_rad_s: 3.0
  yaw_adrc_minimum_speed_mps: 0.1
