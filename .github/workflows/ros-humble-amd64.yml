name: Native Humble Agent and ROS applications

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-components:
    name: Ubuntu 22.04 Humble (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-22.04
          - architecture: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native architecture
        run: test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
      - name: Install ROS 2 Humble
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg2 lsb-release software-properties-common
          sudo add-apt-repository universe
          sudo curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo ${UBUNTU_CODENAME}) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y ros-humble-ros-base python3-colcon-common-extensions \
            python3-rosdep python3-vcstool build-essential cmake ninja-build
          sudo rosdep init || true
          rosdep update
      - name: Build and test Agent
        run: |
          source /opt/ros/humble/setup.bash
          make -C micro_ros_agent setup
          make -C micro_ros_agent build
          make -C micro_ros_agent test
      - name: Build and test ROS applications
        run: |
          source /opt/ros/humble/setup.bash
          make -C ros2_ws deps
          make -C ros2_ws build
          make -C ros2_ws test
