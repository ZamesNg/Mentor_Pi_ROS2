name: Native firmware reproducibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Ubuntu 22.04 firmware (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-22.04
          - architecture: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build prerequisites
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl xz-utils git
      - name: Build, test, verify, and package firmware
        run: |
          make -C firmware setup
          make -C firmware test
          make -C firmware build
          make -C firmware verify
          make -C firmware package
      - name: Upload verified firmware package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mentor-pi-firmware-${{ matrix.architecture }}
          path: firmware/build/packages/*/firmware-pid-release
          if-no-files-found: error
          retention-days: 14
