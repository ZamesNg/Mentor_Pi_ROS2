[platformio]
default_envs = rrclite_stlink
boards_dir = firmware/mentor_pi_mcu/boards
src_dir = firmware/mentor_pi_mcu/target/stm32

[env]
platform = ststm32@17.6.0
board = rrclite_v1
build_type = debug
build_src_filter = -<*>
extra_scripts = pre:firmware/mentor_pi_mcu/platformio_extra.py
custom_firmware_elf = firmware/mentor_pi_mcu/build/stm32/mentor_pi_mcu.elf
custom_firmware_motor_mode = LOCKED
debug_init_break = tbreak main
; Debug is attach-only: flash through the verified upload target first. This
; prevents PlatformIO/IDE debug startup from bypassing artifact/profile gates.
debug_load_mode = manual
debug_speed = 4000

[env:rrclite_stlink]
upload_protocol = stlink
debug_tool = stlink

[env:rrclite_jlink]
upload_protocol = jlink
debug_tool = jlink

; UART upload uses the STM32F407 factory ROM bootloader through the board's
; data USB-C -> CH9102F -> USART1 path. Enter bootloader mode with BOOT/RST,
; then pass the exact CH9102F device with --upload-port. CubeProgrammer is the
; programming backend; this environment still runs the same source/profile and
; immutable-snapshot checks as the SWD environments.
[env:rrclite_uart]
upload_protocol = custom
upload_command = "$PROJECT_DIR/tools/platformio_uart_upload.sh" "$UPLOAD_PORT" "$PROGPATH"

[env:rrclite_stlink_commissioning]
upload_protocol = stlink
debug_tool = stlink
custom_firmware_motor_mode = COMMISSIONING

[env:rrclite_jlink_commissioning]
upload_protocol = jlink
debug_tool = jlink
custom_firmware_motor_mode = COMMISSIONING

[env:rrclite_uart_commissioning]
upload_protocol = custom
upload_command = "$PROJECT_DIR/tools/platformio_uart_upload.sh" "$UPLOAD_PORT" "$PROGPATH"
custom_firmware_motor_mode = COMMISSIONING
